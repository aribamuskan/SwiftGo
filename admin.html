<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftGo Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body>
<script>
if (sessionStorage.getItem("swiftgoAdminLoggedIn") !== "true") {
    window.location.href = "/login.html";
}
</script>

   <div class="admin-header">
    <div>
        <h1>SwiftGo Admin Panel</h1>
        <p>Manage customer bookings and package status.</p>
    </div>

    <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
</div>
<div class="stats-container">
    <div class="stat-card">
        <h3 id="totalBookings">0</h3>
        <p>Total Bookings</p>
    </div>

    <div class="stat-card">
        <h3 id="bookedCount">0</h3>
        <p>Booked</p>
    </div>

    <div class="stat-card">
        <h3 id="pickedCount">0</h3>
        <p>Picked Up</p>
    </div>

    <div class="stat-card">
        <h3 id="transitCount">0</h3>
        <p>In Transit</p>
    </div>

    <div class="stat-card">
        <h3 id="deliveredCount">0</h3>
        <p>Delivered</p>
    </div>
</div>
<!-- ADD NEW BOOKING -->
<div class="add-booking-box">
    <h2>Add New Booking</h2>

    <input type="text" id="newPickup" placeholder="Pickup City">
    <input type="text" id="newDelivery" placeholder="Delivery City">
    <input type="text" id="newPackage" placeholder="Package Details">

    <button onclick="addBooking()">Add Booking</button>
</div>

<div class="search-box">
    <input type="text" id="searchBooking" placeholder="Search by tracking number">
    <button onclick="searchBooking()">Search</button>
</div>
<div class="filter-box">
    <select id="statusFilter">
        <option value="All">All Statuses</option>
        <option value="Booked">Booked</option>
        <option value="Picked Up">Picked Up</option>
        <option value="In Transit">In Transit</option>
        <option value="Out for Delivery">Out for Delivery</option>
        <option value="Delivered">Delivered</option>
    </select>

    <button onclick="filterBookings()">Filter</button>
</div>

<div id="bookingsList">
    <p>Loading bookings...</p>
</div>

<script>
function logoutAdmin() {
    sessionStorage.removeItem("swiftgoAdminLoggedIn");
    window.location.href = "/login.html";
}
async function addBooking() {
    const pickup = document.getElementById("newPickup").value.trim();
    const delivery = document.getElementById("newDelivery").value.trim();
    const packageDetails = document.getElementById("newPackage").value.trim();

    if (!pickup || !delivery || !packageDetails) {
        alert("Please fill all fields.");
        return;
    }

    try {
        const response = await fetch("/api/bookings", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                pickup: pickup,
                delivery: delivery,
                packageDetails: packageDetails
            })
        });

        const data = await response.json();

        if (data.success) {
            alert("Booking added successfully!");

            document.getElementById("newPickup").value = "";
            document.getElementById("newDelivery").value = "";
            document.getElementById("newPackage").value = "";

            loadBookings();
        } else {
            alert(data.message || "Could not add booking.");
        }
    } catch (error) {
        alert("Something went wrong.");
    }
}
function searchBooking() {
    const searchValue = document
        .getElementById("searchBooking")
        .value
        .trim()
        .toLowerCase();

    const bookingCards = document.querySelectorAll("#bookingsList > div");

    bookingCards.forEach(function(card) {
        const text = card.textContent.toLowerCase();

        if (text.includes(searchValue)) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });
}
function filterBookings() {
    const selectedStatus = document.getElementById("statusFilter").value;

    const bookingCards = document.querySelectorAll("#bookingsList > div");

    bookingCards.forEach(function(card) {
        const cardText = card.textContent;

        if (selectedStatus === "All" || cardText.includes("Status: " + selectedStatus)) {
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
    });
}
async function loadBookings() {
    const bookingsList = document.getElementById("bookingsList");

    try {
        const response = await fetch("/api/bookings");
        const data = await response.json();
        console.log("BOOKINGS DATA:", data);
console.log(data);
document.getElementById("totalBookings").textContent = data.bookings.length;

document.getElementById("bookedCount").textContent =
    data.bookings.filter(b => b.status === "Booked").length;

document.getElementById("pickedCount").textContent =
    data.bookings.filter(b => b.status === "Picked Up").length;

document.getElementById("transitCount").textContent =
    data.bookings.filter(b => b.status === "In Transit").length;

document.getElementById("deliveredCount").textContent =
    data.bookings.filter(b => b.status === "Delivered").length;

        if (data.success && data.bookings.length > 0) {
            bookingsList.innerHTML = "";

            data.bookings.forEach(function(booking) {
                bookingsList.innerHTML += `
                    <div>
                        <h3>${booking.trackingNumber}</h3>
                        <p><strong>Pickup:</strong> ${booking.pickupAddress}</p>
                        <p><strong>Delivery:</strong> ${booking.deliveryAddress}</p>
                        <p><strong>Package:</strong> ${booking.packageDetails}</p>
                        <p><strong>Date & Time:</strong> ${booking.date || "Not available"}</p>
                        <p><strong>Status:</strong> ${booking.status || "Booked"}
<select id="status-${booking.trackingNumber}">${booking.trackingNumber}">
    <option value="Booked" ${booking.status === "Booked" ? "selected" : ""}>Booked</option>
<option value="Picked Up" ${booking.status === "Picked Up" ? "selected" : ""}>Picked Up</option>
<option value="In Transit" ${booking.status === "In Transit" ? "selected" : ""}>In Transit</option>
<option value="Out for Delivery" ${booking.status === "Out for Delivery" ? "selected" : ""}>Out for Delivery</option>
<option value="Delivered" ${booking.status === "Delivered" ? "selected" : ""}>Delivered</option>
</select>

<button onclick="updateStatus('${booking.trackingNumber}')">
    Update Status
</button>
<button onclick="deleteBooking('${booking.trackingNumber}')">
    Delete Booking
</button>
<button onclick="editBooking(
  '${booking.trackingNumber}',
  '${booking.pickupAddress}',
  '${booking.deliveryAddress}',
  '${booking.packageDetails}'
)">
  Edit Booking
</button>

                        <hr>
                    </div>
                `;
            });
        } else {
            bookingsList.innerHTML = "<p>No bookings found.</p>";

     }
  } catch (error) {
    console.error("ADMIN ERROR:", error);
    bookingsList.innerHTML = "<p>Could not load bookings.</p>";
  }
}
async function updateStatus(trackingNumber) {
    const statusSelect = document.getElementById("status-" + trackingNumber);
    const status = statusSelect.value;

    try {
        const response = await fetch("/api/bookings/" + trackingNumber + "/status", {
            method: "PUT",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ status: status })
        });

        const data = await response.json();

        if (data.success) {
            alert("Status updated successfully!");
            loadBookings();
        } else {
            alert("Could not update status.");
        }
    } catch (error) {
        alert("Something went wrong.");
    }
}
async function deleteBooking(trackingNumber) {
    const confirmDelete = confirm("Are you sure you want to delete this booking?");

    if (!confirmDelete) {
        return;
    }

    try {
        const response = await fetch("/api/bookings/" + trackingNumber, {
            method: "DELETE"
        });

        const data = await response.json();

        if (data.success) {
            alert("Booking deleted successfully!");
            loadBookings();
        } else {
            alert("Could not delete booking.");
        }
    } catch (error) {
        alert("Something went wrong.");
    }
}
function editBooking(trackingNumber, pickup, delivery, packageDetails) {

    const newPickup = prompt("Enter new pickup address:", pickup);
    if (newPickup === null) return;

    const newDelivery = prompt("Enter new delivery address:", delivery);
    if (newDelivery === null) return;

    const newPackage = prompt("Enter new package details:", packageDetails);
    if (newPackage === null) return;

    updateBooking(
        trackingNumber,
        newPickup,
        newDelivery,
        newPackage
    );
}
async function updateBooking(trackingNumber, pickup, delivery, packageDetails) {
    try {
        const response = await fetch(
            "/api/bookings/" + trackingNumber + "/edit",
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    pickupAddress: pickup,
                    deliveryAddress: delivery,
                    packageDetails: packageDetails
                })
            }
        );

        const data = await response.json();

        if (data.success) {
            alert("Booking updated successfully!");
            loadBookings();
        } else {
            alert(data.message || "Could not update booking.");
        }
    } catch (error) {
        alert("Something went wrong.");
    }
}

loadBookings();
</script>
</body>
</html>
